[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tofawiki"
description = "A service to bring articles easily"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Amir Sarabadani", email = "ladsgroup@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Topic :: Utilities",
]
dependencies = [
    "Flask>=3.0",
    "requests>=2.28",
    "mwparserfromhell>=0.6",
    "sparqlwrapper",
    "jinja2",
    "PyYAML",
    "redis",
]
# version comes from tofawiki/__init__.py
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Ladsgroup/tofawiki"
Source = "https://github.com/Ladsgroup/tofawiki"

[tool.setuptools.dynamic]
version = {attr = "tofawiki.__version__"}

[tool.setuptools.packages.find]
include = ["tofawiki*"]

[tool.setuptools.package-data]
tofawiki = ["cache/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# pycodestyle + pyflakes (what flake8 gave us), plus import sorting,
# pyupgrade and bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
